[package]
name = "desktop"
# 版本号只写在 desktop/package.json，tauri.conf.json 从那里读取（ADR-0008）。
description = "EchoPad desktop"
authors = ["WBBB"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
prost = "0.14.4"
# 0.6.1 在 macOS 上会一直用启动时的主显示器换算指针位置，显示器变化后指针只能贴着屏幕顶部移动；
# 上游已修复但尚未发版，先固定到包含修复的提交。
enigo = { git = "https://github.com/enigo-rs/enigo", rev = "a88d9b7e2cec7043ab5f03e754500a091ea928d1", features = ["platform_specific"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
local-ip-address = "0.6.13"
flate2 = "1.1.10"
anyhow = "1.0.104"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
reqwest = { version = "0.13.5", features = ["json"] }
gethostname = "1.1.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"
semver = "1.0.28"
mdns-sd = "0.21.6"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1"] }
tower-service = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-system-configuration = "0.3.2"
