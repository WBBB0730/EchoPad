// 手机端与电脑端之间的消息定义（ADR-0003）。
// 每个 WebSocket 二进制帧承载一条消息：手机端发 ClientMessage，电脑端发 ServerMessage。
syntax = "proto3";

package echopad.v1;

option java_package = "com.wbbb.echopad.mobile.protocol";

// 两端的协议版本（ADR-0010），只用来取 CURRENT 的值。一端需要理解另一端的新内容时
// （新增、删除消息或字段，或者改变了含义）把 CURRENT 加一。
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 2;
}

// 手机端 → 电脑端
message ClientMessage {
  oneof body {
    Hello hello = 1;
    PointerMove pointer_move = 2;
    ButtonAction button_action = 3;
    Scroll scroll = 4;
    DictationStart dictation_start = 5;
    AudioChunk audio_chunk = 6;
    DictationStop dictation_stop = 7;
    TypeText type_text = 8;
    KeyPress key_press = 9;
    ShortcutAction shortcut_action = 10;
    Zoom zoom = 11;
    DictationCancel dictation_cancel = 12;
    CharacterPress character_press = 13;
  }
}

// 连接建立后的第一条消息，用于验证配对。
message Hello {
  string device_name = 1;
  oneof credential {
    // 首次配对：配对码里的一次性口令。
    string pairing_token = 2;
    // 已配对：配对成功时电脑端发放的设备密钥。
    string device_key = 3;
  }
  // 手机端的固定标识。同一部手机端再次扫码时，电脑端据此替换它原来的配对（ADR-0015）。
  string phone_id = 4;
  // 手机端的协议版本，即 ProtocolVersion.PROTOCOL_VERSION_CURRENT。
  uint32 protocol_version = 5;
}

// 指针的相对位移，单位为电脑屏幕上的点，已应用指针加速。
message PointerMove {
  float dx = 1;
  float dy = 2;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
}

message ButtonAction {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CLICK = 1;
    KIND_DOUBLE_CLICK = 2;
    // 拖拽开始时按下，结束时松开。
    KIND_PRESS = 3;
    KIND_RELEASE = 4;
  }
  MouseButton button = 1;
  Kind kind = 2;
  // 和这次点击一起按下的修饰键（ADR-0016）。拖拽时在 KIND_PRESS 上，电脑端按到 KIND_RELEASE 为止。
  repeated ModifierKey modifiers = 3;
}

// 双指滑动的距离，单位为像素。内容跟随手指移动：手指向下滑，内容向下移动。
message Scroll {
  float dx = 1;
  float dy = 2;
}

// 双指捏合缩放，电脑上和触控板的捏合一样连续缩放。一次缩放以开始为首、以结束为尾。
message Zoom {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_BEGAN = 1;
    PHASE_CHANGED = 2;
    PHASE_ENDED = 3;
  }
  Phase phase = 1;
  // 两指距离相对上一条消息的变化比例减 1：放大为正，缩小为负。只在 PHASE_CHANGED 时有值。
  float magnification = 2;
}

message DictationStart {
  uint32 session_id = 1;
  // 曾用于先编辑模式，已去掉。
  reserved 2;
  reserved "mode";
}

// 16kHz、16 位、单声道 PCM（小端）。
message AudioChunk {
  uint32 session_id = 1;
  bytes pcm = 2;
}

message DictationStop {
  uint32 session_id = 1;
}

// 用户上滑取消：丢弃这次语音输入的全部内容，什么都不上屏。
message DictationCancel {
  uint32 session_id = 1;
}

// 在手机键盘上选定的文字，输入到电脑的插入点。
message TypeText {
  string text = 1;
}

// 特殊键：作用于电脑的单个按键，包括媒体键。
message KeyPress {
  enum Key {
    KEY_UNSPECIFIED = 0;
    KEY_ENTER = 1;
    KEY_BACKSPACE = 2;
    KEY_DELETE = 3;
    KEY_TAB = 4;
    KEY_ESCAPE = 5;
    KEY_SPACE = 6;
    KEY_UP = 7;
    KEY_DOWN = 8;
    KEY_LEFT = 9;
    KEY_RIGHT = 10;
    KEY_HOME = 11;
    KEY_END = 12;
    KEY_PAGE_UP = 13;
    KEY_PAGE_DOWN = 14;
    KEY_PLAY_PAUSE = 15;
    KEY_NEXT_TRACK = 16;
    KEY_PREVIOUS_TRACK = 17;
    KEY_VOLUME_UP = 18;
    KEY_VOLUME_DOWN = 19;
    KEY_MUTE = 20;
  }
  Key key = 1;
  // 和这个键一起按下的修饰键（ADR-0016），媒体键不带。
  repeated ModifierKey modifiers = 2;
}

// 修饰键。电脑端按下、执行这条消息、再松开，不会一直按着（ADR-0016）。
enum ModifierKey {
  MODIFIER_KEY_UNSPECIFIED = 0;
  MODIFIER_KEY_CONTROL = 1;
  // Mac 上的 Option，Windows 上的 Alt。
  MODIFIER_KEY_ALT = 2;
  MODIFIER_KEY_SHIFT = 3;
  // Mac 上的 Command，Windows 上的 Win。
  MODIFIER_KEY_META = 4;
}

// 在手机键盘上打的一个字，和修饰键一起作为组合键按下，不上屏。
message CharacterPress {
  string character = 1;
  repeated ModifierKey modifiers = 2;
}

// 快捷操作：只描述意图，由电脑端按自己的系统换成组合键。
message ShortcutAction {
  enum Shortcut {
    SHORTCUT_UNSPECIFIED = 0;
    SHORTCUT_COPY = 1;
    SHORTCUT_CUT = 2;
    SHORTCUT_PASTE = 3;
    SHORTCUT_UNDO = 4;
    SHORTCUT_REDO = 5;
    SHORTCUT_SELECT_ALL = 6;
    SHORTCUT_SWITCH_APP = 7;
  }
  Shortcut shortcut = 1;
}

// 电脑端 → 手机端
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Rejected rejected = 2;
    DictationFinished dictation_finished = 5;
    DictationFailed dictation_failed = 6;
    SwitchRequest switch_request = 8;
  }
  // 曾用于在手机端显示识别中的文字和逐句上屏的文字，已去掉（ADR-0013）。
  reserved 3, 4;
  reserved "interim_text", "committed_text";
  // 曾用于先编辑模式，已去掉。
  reserved 7;
  reserved "compose_text";
}

// 验证通过。首次配对时携带新发放的设备密钥，之后的连接为空。
message Welcome {
  string desktop_name = 1;
  string device_key = 2;
  // 电脑端的固定标识。电脑的地址变了以后，手机端在局域网里按它找到新地址。
  string desktop_id = 3;
  // 电脑的系统，手机端按它显示修饰键的名称。
  OperatingSystem operating_system = 4;
}

enum OperatingSystem {
  OPERATING_SYSTEM_UNSPECIFIED = 0;
  OPERATING_SYSTEM_MACOS = 1;
  OPERATING_SYSTEM_WINDOWS = 2;
}

message Rejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // 配对口令已失效，或设备密钥不再被电脑端认可。
    REASON_INVALID_CREDENTIAL = 1;
    // 两端的协议版本不一致。电脑端没有验证配对，配对仍然有效。
    REASON_VERSION_MISMATCH = 2;
  }
  Reason reason = 1;
  // 版本不兼容时为电脑端的协议版本，手机端据此判断该更新哪一端。
  uint32 protocol_version = 2;
}

// 这次语音输入已经结束，整理好的文字已经上屏。
message DictationFinished {
  uint32 session_id = 1;
  // 整理失败时的原因，这时上屏的是识别原文。整理成功或整理关闭时为空。
  string cleanup_failure = 2;
}

message DictationFailed {
  uint32 session_id = 1;
  string message = 2;
}

// 电脑端请手机端切换过来，把这台电脑端设为当前电脑（ADR-0015）。
message SwitchRequest {}
